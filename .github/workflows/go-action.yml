name: go-ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.23.x'
  APP_NAME: app
  BUILD_PATH: .

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Arquivos não formatados:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build
        run: |
          mkdir -p dist
          go build -v -o dist/$APP_NAME $BUILD_PATH

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}
          path: dist/